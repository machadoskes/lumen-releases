<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Trocado pelo --base-href do `flutter build web` (tools/build-web.ps1). -->
  <base href="/lumen-releases/app/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lumen: clareza sobre as suas finanças.">
  <meta name="theme-color" content="#16171A">
  <!-- Só o próprio site, o Supabase (dados cifrados) e a API do GitHub
       (versões); fontes de reserva do Flutter para símbolos fora da Open Sans. Decisão 116. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data: https://*.supabase.co wss://*.supabase.co https://api.github.com https://fonts.gstatic.com; frame-src 'none'; object-src 'none'; base-uri 'self'">

  <!-- iPhone: "Adicionar à Tela de Início" abre em tela cheia. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumen">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Lumen</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #16171A; }
    #lumen-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: -apple-system, system-ui, sans-serif; color: #c9c3b6;
      transition: opacity .3s;
    }
    #lumen-splash img { width: 96px; height: 96px; border-radius: 22px; }
    #lumen-splash p { margin: 0; font-size: 14px; opacity: .8; }
  </style>
</head>
<body>
  <div id="lumen-splash">
    <img src="icons/Icon-192.png" alt="">
    <p>Abrindo o Lumen…</p>
  </div>
  <script>
    // Some quando o Flutter desenhar o primeiro quadro.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('lumen-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
